name: Cookbook in the Sandbox

# Every recipe bundle laid out by the Sandbox of the pull request: its font
# loader, its layout service and its worker, built from the working tree
# (`pnpm cookbook sandbox`, #736); then the composed-page bench
# (`pnpm cookbook bench`, #869). It fails when the Sandbox raises a
# warning the recipe's pen does not, cannot lay a bundle out, or hangs. A
# page count other than the recorded one is a warning here: a pull request
# that moves lines on purpose cannot capture the recipes again before its
# release.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - packages/postext-sandbox/**
      - packages/postext/**
      - cookbook/**
      - apps/web/public/cookbook/**
      - apps/web/scripts/cookbook/**
      - apps/web/src/lib/cookbook/**
      - .github/workflows/cookbook-sandbox.yml

# Read-only token: no job here writes to the repository (artifacts and
# caches use the runner's own token).
permissions:
  contents: read

jobs:
  sandbox:
    name: Lay out the recipe bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=postext-sandbox...

      # Font files and style sheets, fetched once a week: a Chinese or
      # Japanese family comes in some 120 files.
      - name: The week of the font cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # The newest cache of the week, whatever it holds: a key is written
      # once, so each run that fetched something saves under a key of its own
      # (below) and the next one starts from it.
      - uses: actions/cache/restore@v4
        id: net
        with:
          path: apps/web/.cache/cookbook-net
          key: cookbook-net-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.week.outputs.week }}-
          restore-keys: |
            cookbook-net-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.week.outputs.week }}-
            cookbook-net-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: What the cache holds before the run
        id: before
        run: echo "files=$(find apps/web/.cache/cookbook-net -type f 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: pnpm cookbook sandbox
        env:
          COOKBOOK_CHROME: /usr/bin/google-chrome
        run: pnpm cookbook sandbox --report "$RUNNER_TEMP/cookbook-sandbox.json"

      # The composed-page bench (#869): every recipe whose Markdown declares
      # composed pages, run on the pull request's engine (the packages'
      # dist) in every sample language, then again with every text 30 %
      # longer. It fails on a frameOverflow, tocGroupSplit or contentInConfig
      # (C37), a page that neither rearranges nor goes on under the longer
      # text, or warns without a proposal (C38), an element the source map
      # does not bring back (C40) and a configuration over 1 MB (C41), with
      # every capture check besides. C39 compares the layout hash with the
      # approved capture (the pixels are left out: these pages are painted on
      # Linux, the captures elsewhere); a layout moved on purpose warns here
      # and is captured again after its release.
      - name: pnpm cookbook bench
        if: always()
        env:
          COOKBOOK_CHROME: /usr/bin/google-chrome
        run: pnpm cookbook bench --engine local --no-pixels --hash-warn --report "$RUNNER_TEMP/cookbook-bench.json"

      # The bench on its own fixture recipe (es, en, ca), which no site page
      # publishes: the checks above run end to end on every pull request,
      # before any published recipe has composed pages.
      - name: pnpm cookbook bench (fixture)
        if: always()
        env:
          COOKBOOK_CHROME: /usr/bin/google-chrome
          COOKBOOK_RECIPES_DIR: ${{ github.workspace }}/apps/web/src/lib/cookbook/fixtures/recipes
          COOKBOOK_CAPTURE_DIR: ${{ runner.temp }}/cookbook-bench-fixture
        run: pnpm cookbook bench --engine local --no-pixels --hash-warn --report "$RUNNER_TEMP/cookbook-bench-fixture.json"

      # Kept when the check fails too, and only when this run fetched a
      # file the cache did not hold: the next run starts from it.
      - name: What the cache holds after the run
        id: after
        if: always()
        run: echo "files=$(find apps/web/.cache/cookbook-net -type f 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@v4
        if: always() && steps.after.outputs.files != steps.before.outputs.files
        with:
          path: apps/web/.cache/cookbook-net
          key: cookbook-net-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.week.outputs.week }}-${{ steps.after.outputs.files }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookbook-sandbox
          path: |
            ${{ runner.temp }}/cookbook-sandbox.json
            ${{ runner.temp }}/cookbook-bench.json
            ${{ runner.temp }}/cookbook-bench-fixture.json
          retention-days: 14
